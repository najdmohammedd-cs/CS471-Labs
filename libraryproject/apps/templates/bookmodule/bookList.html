{% extends "layouts/base.html" %}
{% load static %}

{% block title %} Book List {% endblock title %}

{% block content %}
<div style="padding: 20px;">
    <h2>Books</h2>
    {% for obj in books %}
        <p>ID: {{ obj.id }}, Title: {{ obj.title }}</p>
        <hr>
    {% empty %}
        <p>No books found.</p>
    {% endfor %}
</div>
{% endblock content %}
